[pytest]
# pytest-asyncio >=1.4 warns if this is left unset; we have no async
# fixtures yet, but set it explicitly so the default doesn't silently
# change out from under later tasks (and to keep test output clean now).
asyncio_default_fixture_loop_scope = function

filterwarnings =
    # starlette's TestClient warns that it prefers `httpx2` over `httpx`.
    # The plan's tech stack (and this task's brief) pins `httpx`
    # specifically, so this is a known, accepted upstream deprecation
    # notice rather than something to act on here.
    ignore::starlette.exceptions.StarletteDeprecationWarning
    # Authlib's `authlib.jose` module nags to switch to `joserfc`, but the
    # brief for Task 3 specifies Authlib's token-verification for Google
    # ID tokens, so this is a known, accepted upstream notice rather than
    # something to act on here.
    ignore::authlib.deprecate.AuthlibDeprecationWarning
