# Splice the `location` blocks below into your existing TLS server block
# for finance.itluobo.com — this file intentionally does NOT include
# `listen 443 ssl`/`ssl_certificate`/etc., since those already exist on
# this VPS in whatever pattern your other sites use (see
# /etc/nginx/sites-available/ for an example to copy from). This file is
# the part that's actually new.

# Flutter web app's own JS calls the backend at /api/... (see
# API_BASE_URL in deploy.sh) — strip the prefix, the backend's own route
# paths are unprefixed.
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Must stay >= backend/app/services/image_storage.py's MAX_UPLOAD_BYTES
    # (currently 10 * 1024 * 1024 = exactly 10MB). nginx's own default is
    # 1MB, which would 413 a real phone camera JPEG (typically 2-6MB)
    # before it ever reaches the backend's own size check. If that
    # constant changes, update this value to match.
    client_max_body_size 10m;

    # /uploads/{id}/extract waits on an Azure OpenAI vision call that can
    # run long on a slow response; nginx's default proxy_read_timeout is
    # only 60s.
    proxy_read_timeout 120s;
}

# These files drive the Flutter web PWA's own update/versioning logic
# (flutter_service_worker.js decides whether to fetch a new main.dart.js
# by comparing content hashes). With no Cache-Control at all, browsers
# fall back to heuristic caching, which has repeatedly left a browser
# running JS from a deploy that's already several versions stale, well
# past a plain reload — forcing revalidation here means a deploy takes
# effect on the very next load, every time, no manual cache-clearing.
location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache";
}
location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache";
}
location = /main.dart.js {
    add_header Cache-Control "no-cache";
}
location = /version.json {
    add_header Cache-Control "no-cache";
}
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Everything else is the Flutter web build. try_files' SPA fallback is
# what makes a direct browser load of /dashboard or /insights (the
# Flutter app's own client-side routes — note these are the same path
# strings as some backend API routes above, which is exactly why the
# /api/ prefix split exists) serve index.html instead of 404ing, so
# go_router can take over client-side.
location / {
    root /var/www/finance-frontend;
    try_files $uri $uri/ /index.html;
}
